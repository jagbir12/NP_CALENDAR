<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>नेपाली पात्रो | Nepali Calendar (BS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Theme tokens ---------- */
  :root{
    --bg:#f5f4f1;
    --bg-elevated:#ffffff;
    --bg-muted:#ececea;
    --text:#1c1b1a;
    --text-muted:#6b6a67;
    --border:#ddd9d3;
    --accent:#a5372c;
    --accent-contrast:#ffffff;
    --saturday:#a5372c;
    --today-ring:#1c7a5e;
    --holiday-dot:#c9812c;
    --shadow:0 8px 24px rgba(0,0,0,.12);
    --focus-ring:#2f6fed;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17161a;
      --bg-elevated:#211f24;
      --bg-muted:#2a282e;
      --text:#f0eee9;
      --text-muted:#a6a3a0;
      --border:#37343b;
      --accent:#e07a63;
      --accent-contrast:#1c1b1a;
      --saturday:#e6836b;
      --today-ring:#5fd6ab;
      --holiday-dot:#e2ac5f;
      --shadow:0 8px 24px rgba(0,0,0,.45);
      --focus-ring:#6fa2ff;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17161a;
    --bg-elevated:#211f24;
    --bg-muted:#2a282e;
    --text:#f0eee9;
    --text-muted:#a6a3a0;
    --border:#37343b;
    --accent:#e07a63;
    --accent-contrast:#1c1b1a;
    --saturday:#e6836b;
    --today-ring:#5fd6ab;
    --holiday-dot:#e2ac5f;
    --shadow:0 8px 24px rgba(0,0,0,.45);
    --focus-ring:#6fa2ff;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans Devanagari','Noto Sans','Nirmala UI','Mangal',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
    padding:12px;
    padding-block:16px;
    line-height:1.4;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{ max-width:760px; margin:0 auto; }
  h1{ font-size:1.15rem; margin:0; font-weight:600; }
  button{
    font-family:inherit;
    font-size:0.95rem;
    color:var(--text);
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
  }
  button:hover{ background:var(--bg-muted); }
  button:focus-visible, [tabindex]:focus-visible, select:focus-visible, input:focus-visible{
    outline:2.5px solid var(--focus-ring);
    outline-offset:2px;
  }
  button.icon-btn{ padding:8px 10px; font-size:1.05rem; line-height:1; }
  button.primary{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); font-weight:600; }
  select, input[type=number]{
    font-family:inherit;
    font-size:0.95rem;
    padding:7px 8px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg-elevated);
    color:var(--text);
  }

  /* ---------- Header ---------- */
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:14px;
  }
  .top-actions{ display:flex; gap:6px; }

  /* ---------- Month nav ---------- */
  .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    gap:6px; margin-bottom:10px; background:var(--bg-elevated);
    border:1px solid var(--border); border-radius:12px; padding:8px;
  }
  .month-nav .center{ display:flex; flex-direction:column; align-items:center; flex:1; min-width:0; }
  .month-label-btn{
    border:none; background:none; font-weight:600; font-size:1.05rem;
    color:var(--text); padding:4px 8px; border-radius:8px; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .month-label-btn:hover{ background:var(--bg-muted); }
  .today-btn{ font-size:0.85rem; }

  /* ---------- Calendar grid ---------- */
  .weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px; }
  .weekday-row div{
    text-align:center; font-size:0.78rem; color:var(--text-muted); font-weight:600;
    padding:4px 0;
  }
  .weekday-row div.sat, .weekday-row div.sun{ color:var(--saturday); }
  [role="grid"]{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .day-cell{
    position:relative;
    aspect-ratio:1/0.92;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:10px;
    cursor:pointer; padding:2px 2px 4px;
    min-height:52px;
  }
  .day-cell.pad{ background:transparent; border-color:transparent; cursor:default; }
  .day-cell .bs-num{ font-size:1.15rem; font-weight:600; line-height:1.1; }
  .day-cell .ad-num{ font-size:0.62rem; color:var(--text-muted); margin-top:2px; }
  .day-cell.sat .bs-num, .day-cell.sun .bs-num{ color:var(--saturday); }
  .day-cell.today{ box-shadow:inset 0 0 0 2px var(--today-ring); }
  .day-cell.selected{ background:var(--bg-muted); }
  .day-cell .holiday-dot{
    position:absolute; top:5px; right:7px; width:6px; height:6px; border-radius:50%;
    background:var(--holiday-dot);
  }
  .day-cell .note-dot{
    position:absolute; top:5px; left:7px; width:6px; height:6px; border-radius:50%;
    background:var(--focus-ring);
  }
  .day-cell:focus-visible{ outline:2.5px solid var(--focus-ring); outline-offset:1px; }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin:12px 2px 0; font-size:0.78rem; color:var(--text-muted); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .legend i.hol{ background:var(--holiday-dot); }
  .legend i.tod{ background:var(--today-ring); }
  .legend i.note{ background:var(--focus-ring); }

  /* ---------- Panels (converter / tests) ---------- */
  details.panel{
    margin-top:16px; background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:12px; padding:2px 14px;
  }
  details.panel summary{
    cursor:pointer; padding:12px 0; font-weight:600; list-style:none;
    display:flex; align-items:center; justify-content:space-between;
  }
  details.panel summary::-webkit-details-marker{ display:none; }
  details.panel summary::after{ content:'+'; font-size:1.2rem; color:var(--text-muted); }
  details.panel[open] summary::after{ content:'−'; }
  .panel-body{ padding-bottom:14px; }

  .conv-block{ margin-bottom:16px; }
  .conv-block h3{ font-size:0.85rem; margin:0 0 8px; color:var(--text-muted); font-weight:600; }
  .conv-row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .conv-row select, .conv-row input{ width:84px; }
  .conv-result{
    font-size:0.92rem; padding:10px 12px; border-radius:8px; background:var(--bg-muted);
    min-height:1.2em;
  }
  .conv-result.error{ color:var(--saturday); }

  /* ---------- Dialogs ---------- */
  dialog{
    border:none; border-radius:14px; padding:0; color:var(--text); background:var(--bg-elevated);
    box-shadow:var(--shadow); width:min(420px,92vw);
  }
  dialog::backdrop{ background:rgba(0,0,0,.45); }
  .dialog-inner{ padding:18px 20px 20px; }
  .dialog-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .dialog-head h2{ font-size:1.1rem; margin:0; }
  .dialog-close{ padding:6px 10px; }
  .detail-row{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:0.92rem; }
  .detail-row:last-of-type{ border-bottom:none; }
  .detail-row .k{ color:var(--text-muted); }
  .events-block{ margin-top:10px; }
  .event-item{ display:flex; gap:8px; align-items:center; padding:6px 0; font-size:0.9rem; }
  .event-item i{ width:7px; height:7px; border-radius:50%; background:var(--holiday-dot); flex:none; }
  .muted{ color:var(--text-muted); font-size:0.88rem; }

  .notes-block{ margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }
  .notes-heading{ font-size:0.85rem; margin:0 0 8px; color:var(--text-muted); font-weight:600; }
  .note-item{
    display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
    padding:7px 0; border-bottom:1px solid var(--border); font-size:0.9rem;
  }
  .note-item span{ white-space:pre-wrap; word-break:break-word; }
  .note-del{
    flex:none; border:none; background:none; padding:2px 6px; color:var(--text-muted);
    font-size:0.85rem; border-radius:6px;
  }
  .note-del:hover{ background:var(--bg-muted); color:var(--saturday); }
  .note-form{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .note-form textarea{
    font-family:inherit; font-size:0.9rem; padding:8px; border-radius:8px;
    border:1px solid var(--border); background:var(--bg-elevated); color:var(--text); resize:vertical;
  }
  .note-form button{ align-self:flex-end; }
  .note-status{ min-height:1em; }
  .note-status.error{ color:var(--saturday); }

  #pickerDialog select{ width:100%; margin-bottom:10px; }
  .picker-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }

  .test-summary{ font-weight:600; margin-bottom:8px; }
  .test-list{ list-style:none; margin:0; padding:0; font-size:0.85rem; }
  .test-list li{ padding:4px 0; display:flex; gap:8px; }
  .test-list li.pass .mark{ color:var(--today-ring); }
  .test-list li.fail .mark{ color:var(--saturday); }
  .test-list .mark{ font-weight:700; width:1.2em; flex:none; }

  footer.note{ margin-top:18px; font-size:0.78rem; color:var(--text-muted); text-align:center; }

  @media (max-width:380px){
    .day-cell .bs-num{ font-size:1rem; }
    .conv-row select, .conv-row input{ width:74px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1 id="appTitle">नेपाली पात्रो</h1>
    <div class="top-actions">
      <button type="button" id="themeBtn" class="icon-btn" aria-label="Toggle color theme">🌓</button>
      <button type="button" id="langBtn">English</button>
    </div>
  </header>

  <nav class="month-nav" aria-label="Month navigation">
    <button type="button" id="prevBtn" class="icon-btn" aria-label="Previous month">‹</button>
    <div class="center">
      <button type="button" id="monthLabelBtn" class="month-label-btn"></button>
      <button type="button" id="todayBtn" class="today-btn">आज</button>
    </div>
    <button type="button" id="nextBtn" class="icon-btn" aria-label="Next month">›</button>
  </nav>

  <div class="weekday-row" id="weekdayRow"></div>
  <div role="grid" id="calGrid" aria-labelledby="monthLabelBtn"></div>

  <div class="legend">
    <span><i class="tod"></i><span id="legendToday">आज</span></span>
    <span><i class="hol"></i><span id="legendHoliday">चाड/बिदा</span></span>
    <span><i class="note"></i><span id="legendNote">नोट</span></span>
    <span style="color:var(--saturday)">■ <span id="legendSat">शनिबार (साप्ताहिक बिदा)</span></span>
  </div>

  <!-- Converter panel -->
  <details class="panel" id="converterPanel">
    <summary id="converterSummary">मिति परिवर्तक (BS ⇄ AD)</summary>
    <div class="panel-body">
      <div class="conv-block">
        <h3 id="bsToAdLabel">बिक्रम सम्वत → ईस्वी सन्</h3>
        <div class="conv-row">
          <select id="c1_y" aria-label="BS year"></select>
          <select id="c1_m" aria-label="BS month"></select>
          <select id="c1_d" aria-label="BS day"></select>
          <button type="button" id="c1_go" class="primary">→</button>
        </div>
        <div class="conv-result" id="c1_result" role="status"></div>
      </div>
      <div class="conv-block">
        <h3 id="adToBsLabel">ईस्वी सन् → बिक्रम सम्वत</h3>
        <div class="conv-row">
          <input type="number" id="c2_y" aria-label="AD year" placeholder="YYYY" min="1900" max="2100">
          <select id="c2_m" aria-label="AD month"></select>
          <select id="c2_d" aria-label="AD day"></select>
          <button type="button" id="c2_go" class="primary">→</button>
        </div>
        <div class="conv-result" id="c2_result" role="status"></div>
      </div>
    </div>
  </details>

  <!-- Self-test panel -->
  <details class="panel" id="testPanel">
    <summary id="testSummaryLabel">Self-tests (conversion accuracy)</summary>
    <div class="panel-body">
      <div class="test-summary" id="testSummary"></div>
      <ul class="test-list" id="testList"></ul>
    </div>
  </details>

  <footer class="note" id="footerNote">
    Month-length data: BS 2000–2090 · anchored at 1 Baisakh 2000 BS = 14 April 1943 AD
  </footer>
</div>

<!-- Day details dialog -->
<dialog id="detailDialog" aria-labelledby="detailTitle">
  <div class="dialog-inner">
    <div class="dialog-head">
      <h2 id="detailTitle"></h2>
      <button type="button" class="dialog-close" id="detailClose" aria-label="Close">✕</button>
    </div>
    <div id="detailBody"></div>
  </div>
</dialog>

<!-- Year/month picker dialog -->
<dialog id="pickerDialog" aria-labelledby="pickerTitle">
  <div class="dialog-inner">
    <div class="dialog-head">
      <h2 id="pickerTitle">वर्ष/महिना छान्नुहोस्</h2>
      <button type="button" class="dialog-close" id="pickerClose" aria-label="Close">✕</button>
    </div>
    <select id="pickerYear" aria-label="Year"></select>
    <select id="pickerMonth" aria-label="Month"></select>
    <div class="picker-actions">
      <button type="button" id="pickerGo" class="primary">जानुहोस्</button>
    </div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

   covering BS 2000–2090. There is NO closed-form formula for the BS
   calendar (unlike a fixed 30/31-day Gregorian rule) -- month lengths were
   historically fixed each year by the Government of Nepal / Nepal
   Panchang Nirnayak Samiti, so any converter MUST use a verified lookup
   table rather than a computed approximation.

   SOURCE: this table is reproduced verbatim from the open-source project
     whitphx/nepali-calendar-js  (MIT licensed)
     https://github.com/whitphx/nepali-calendar-js/blob/master/index.js

   converters. The full table below was independently spot-checked against
   nepalicalendar.rat32.com for BS 2000, 2050, 2070, 2080, 2081, 2082 and
   2083 Baisakh 1 -- all seven produced identical Gregorian dates via the
   conversion routine in this file (see the self-test section below), so
   the table and the epoch anchor are mutually consistent with multiple
   independent public calendars.

   To extend the calendar past BS 2090, add further "year: [12 lengths]"
   entries here from an equally authoritative source (see README.md).
   ========================================================================= */

/* =========================================================================
   CONVERSION (pure day-count arithmetic, anchored at EPOCH_AD_MS above)
   ========================================================================= */
function bsYearLength(y){ return BS_CALENDAR_DATA[y].reduce((a,b)=>a+b,0); }

const BS_YEAR_START_OFFSET = (function(){
  const m = {};
  let acc = 0;
  for (let y=BS_MIN_YEAR; y<=BS_MAX_YEAR; y++){ m[y]=acc; acc+=bsYearLength(y); }
  m._end = acc; // total days spanned by the whole table (exclusive upper bound)
  return m;
})();

function isValidBsDate(y,m,d){
  if (y<BS_MIN_YEAR || y>BS_MAX_YEAR) return false;
  if (m<1 || m>12) return false;
  const len = BS_CALENDAR_DATA[y][m-1];
  return d>=1 && d<=len;
}

function bsMonthLength(y,m){
  if (y<BS_MIN_YEAR||y>BS_MAX_YEAR||m<1||m>12) return null;
  return BS_CALENDAR_DATA[y][m-1];
}

/* BS date -> {gy,gm,gd,weekday} (weekday: 0=Sunday..6=Saturday) */
function bsToAD(y,m,d){
  if (!isValidBsDate(y,m,d)){
    return { error:true, message:`Out of range: BS ${y}/${m}/${d} (supported: ${BS_MIN_YEAR}–${BS_MAX_YEAR})` };
  }
  const monthsArr = BS_CALENDAR_DATA[y];
  let days = BS_YEAR_START_OFFSET[y];
  for (let mm=1; mm<m; mm++) days += monthsArr[mm-1];
  days += (d-1);
  const dt = new Date(EPOCH_AD_MS + days*86400000);
  return { gy:dt.getUTCFullYear(), gm:dt.getUTCMonth()+1, gd:dt.getUTCDate(), weekday:dt.getUTCDay() };
}

/* AD date -> {y,m,d,weekday} */
function adToBS(gy,gm,gd){
  const ms = Date.UTC(gy, gm-1, gd);
  if (isNaN(ms)) return { error:true, message:'Invalid Gregorian date' };
  const diffDays = Math.round((ms - EPOCH_AD_MS) / 86400000);
  if (diffDays < 0 || diffDays >= BS_YEAR_START_OFFSET._end){
    const minAD = bsToAD(BS_MIN_YEAR,1,1);
    const maxLen = bsMonthLength(BS_MAX_YEAR,12);
    const maxAD = bsToAD(BS_MAX_YEAR,12,maxLen);
    return { error:true, message:`Out of range: supported AD dates are ${minAD.gy}-${String(minAD.gm).padStart(2,'0')}-${String(minAD.gd).padStart(2,'0')} to ${maxAD.gy}-${String(maxAD.gm).padStart(2,'0')}-${String(maxAD.gd).padStart(2,'0')}` };
  }
  let y = BS_MIN_YEAR;
  for (let yy=BS_MIN_YEAR; yy<=BS_MAX_YEAR; yy++){
    if (yy===BS_MAX_YEAR || BS_YEAR_START_OFFSET[yy+1] > diffDays){ y = yy; break; }
  }
  let remaining = diffDays - BS_YEAR_START_OFFSET[y];
  const monthsArr = BS_CALENDAR_DATA[y];
  let m = 1;
  while (remaining >= monthsArr[m-1]){ remaining -= monthsArr[m-1]; m++; }
  const d = remaining+1;
  const weekday = new Date(ms).getUTCDay();
  return { y, m, d, weekday };
}

/* "Today" in Nepal Standard Time (UTC+5:45), independent of browser tz.
   Date.now() is an absolute epoch-ms value (already timezone free); adding
   the fixed 5h45m offset and reading the UTC fields back off the shifted
   instant yields NPT wall-clock date/time. */
function nowInNPT(){
  const shifted = new Date(Date.now() + 5.75*3600*1000);
  return { gy:shifted.getUTCFullYear(), gm:shifted.getUTCMonth()+1, gd:shifted.getUTCDate() };
}

const DEV_DIGITS = ['०','१','२','३','४','५','६','७','८','९'];

function numeral(n, lang){
  const s = String(n);
  if (lang!=='ne') return s;
  return s.replace(/[0-9]/g, ch => DEV_DIGITS[+ch]);
}
function monthName(m, lang){ return lang==='ne' ? MONTHS_NE[m-1] : MONTHS_EN[m-1]; }
function weekdayName(i, lang){ return lang==='ne' ? WEEKDAYS_NE[i] : WEEKDAYS_EN[i]; }
function weekdayShort(i, lang){ return lang==='ne' ? WEEKDAYS_NE_SHORT[i] : WEEKDAYS_EN_SHORT[i]; }

/* =========================================================================
   RENDER: month grid
   ========================================================================= */
function renderMonthLabel(){
  el('monthLabelBtn').textContent =
    `${monthName(state.month, state.lang)} ${numeral(state.year, state.lang)}`;
}

function renderGrid(){
  const grid = el('calGrid');
  grid.innerHTML = '';
  grid.setAttribute('role','grid');

  const len = bsMonthLength(state.year, state.month);
  const first = bsToAD(state.year, state.month, 1);
  const leadBlank = first.weekday; // 0..6, Sunday-first grid

  const today = todayBS;
  const totalCells = leadBlank + len;
  const trailBlank = (7 - (totalCells % 7)) % 7;

  const cells = [];
  for (let i=0;i<leadBlank;i++) cells.push(null);
  for (let d=1; d<=len; d++) cells.push(d);
  for (let i=0;i<trailBlank;i++) cells.push(null);

  // advance an AD cursor date across the month to avoid recomputing bsToAD per cell
  let cursor = new Date(EPOCH_AD_MS + (BS_YEAR_START_OFFSET[state.year] +
    (function(){ let s=0; for(let mm=1;mm<state.month;mm++) s+=BS_CALENDAR_DATA[state.year][mm-1]; return s; })()
  ) * 86400000);

  cells.forEach((day, idx) => {
    const cell = document.createElement('div');
    if (day===null){
      cell.className = 'day-cell pad';
      cell.setAttribute('role','presentation');
      grid.appendChild(cell);
      return;
    }
    const weekdayIdx = idx % 7;
    const adY = cursor.getUTCFullYear(), adM = cursor.getUTCMonth()+1, adD = cursor.getUTCDate();
    const isToday = today && !today.error && today.y===state.year && today.m===state.month && today.d===day;
    const isSat = weekdayIdx===6;
    const isSun = weekdayIdx===0;
    const isSelected = state.selected && state.selected.y===state.year && state.selected.m===state.month && state.selected.d===day;
    const holidays = holidaysFor(state.year, state.month, day);

    cell.className = 'day-cell' + (isSat?' sat':'') + (isSun?' sun':'') + (isToday?' today':'') + (isSelected?' selected':'');
    cell.setAttribute('role','gridcell');
    cell.tabIndex = (day===state.focusDay) ? 0 : -1;
    cell.dataset.day = day;
    const fullLabel = `${monthName(state.month,state.lang)} ${numeral(day,state.lang)}, ${numeral(state.year,state.lang)} BS — ${weekdayName(weekdayIdx,state.lang)} — ${adM}/${adD}/${adY} AD` + (holidays.length? ` — ${holidays.map(h=>state.lang==='ne'?h.ne:h.en).join(', ')}`:'');
    cell.setAttribute('aria-label', fullLabel);
    if (isToday) cell.setAttribute('aria-current','date');
    if (isSelected) cell.setAttribute('aria-selected','true');

    const bsNum = document.createElement('div');
    bsNum.className = 'bs-num';
    bsNum.textContent = numeral(day, state.lang);
    cell.appendChild(bsNum);

    const adNum = document.createElement('div');
    adNum.className = 'ad-num';
    adNum.textContent = `${numeral(adD,state.lang)} ${AD_MONTHS_SHORT[adM-1]}`;
    cell.appendChild(adNum);

    if (holidays.length){
      const dot = document.createElement('span');
      dot.className = 'holiday-dot';
      cell.appendChild(dot);
    }
    if (notesFor(state.year, state.month, day).length){
      const ndot = document.createElement('span');
      ndot.className = 'note-dot';
      cell.appendChild(ndot);
    }

    cell.addEventListener('click', () => { state.focusDay = day; openDetails(state.year, state.month, day); });
    cell.addEventListener('keydown', onCellKeydown);

    grid.appendChild(cell);
    cursor.setUTCDate(cursor.getUTCDate()+1);
  });
}

function holidaysFor(y,m,d){
  const list = FIXED_BS_HOLIDAYS.filter(h => h.month===m && h.day===d);
  const key = `${y}-${m}-${d}`;
  if (LUNAR_HOLIDAYS_BY_DATE[key]) list.push(...LUNAR_HOLIDAYS_BY_DATE[key]);
  return list;
}

function render(){
  applyStaticLabels();
  buildWeekdayRow();
  renderMonthLabel();
  renderGrid();
  el('prevBtn').disabled = (state.year===BS_MIN_YEAR && state.month===1);
  el('nextBtn').disabled = (state.year===BS_MAX_YEAR && state.month===12);
}

/* =========================================================================
   KEYBOARD NAVIGATION (roving tabindex within the grid)
   ========================================================================= */
function onCellKeydown(e){
  const day = Number(e.currentTarget.dataset.day);
  let delta = 0, monthDelta = 0;
  switch(e.key){
    case 'ArrowLeft': delta=-1; break;
    case 'ArrowRight': delta=1; break;
    case 'ArrowUp': delta=-7; break;
    case 'ArrowDown': delta=7; break;
    case 'Enter':
    case ' ':
      e.preventDefault();
      openDetails(state.year, state.month, day);
      return;
    default: return;
  }
  e.preventDefault();
  let target = day + delta;
  let y = state.year, m = state.month;
  const len = bsMonthLength(y,m);
  if (target < 1){
    m -= 1; if (m<1){ m=12; y-=1; }
    if (y<BS_MIN_YEAR) return;
    target = bsMonthLength(y,m) + target;
  } else if (target > len){
    target = target - len;
    m += 1; if (m>12){ m=1; y+=1; }
    if (y>BS_MAX_YEAR) return;
  }
  state.year = y; state.month = m; state.focusDay = target;
  render();
  const newCell = el('calGrid').querySelector(`[data-day="${target}"]`);
  if (newCell) newCell.focus();
}

  btn.textContent = ne ? 'थप्नुहोस्' : 'Add';
  const status = document.createElement('div');
  status.className = 'muted note-status';
  if (!sb){
    status.textContent = ne ? 'नोट सुविधा उपलब्ध छैन (अफलाइन)।' : 'Notes are unavailable right now (offline).';
    ta.disabled = true; btn.disabled = true;
  }
  form.appendChild(ta);
  form.appendChild(btn);
  form.appendChild(status);
  wrap.appendChild(form);

  btn.addEventListener('click', async ()=>{
    const text = ta.value.trim();
    if (!text) return;
    btn.disabled = true;
    status.classList.remove('error');
    status.textContent = ne ? 'सुरक्षित गर्दै...' : 'Saving...';
    try {
      await addNote(y,m,d,text);
      ta.value = '';
      status.textContent = '';
      renderList();
    } catch(e){
      console.error(e);
      status.textContent = ne ? 'सुरक्षित गर्न असफल भयो।' : 'Failed to save note.';
      status.classList.add('error');
    } finally {
      btn.disabled = false;
    }
  });

  return wrap;
}
el('detailClose').addEventListener('click', ()=> el('detailDialog').close());

/* =========================================================================
   NAV BUTTON HANDLERS
   ========================================================================= */
el('prevBtn').addEventListener('click', ()=>{
  let {year,month} = state;
  month -= 1; if (month<1){ month=12; year-=1; }
  if (year<BS_MIN_YEAR) return;
  state.year=year; state.month=month; state.focusDay=1;
  render();
});
el('nextBtn').addEventListener('click', ()=>{
  let {year,month} = state;
  month += 1; if (month>12){ month=1; year+=1; }
  if (year>BS_MAX_YEAR) return;
  state.year=year; state.month=month; state.focusDay=1;
  render();
});
el('todayBtn').addEventListener('click', ()=>{
  const n = nowInNPT();
  const b = adToBS(n.gy,n.gm,n.gd);
  if (b.error) return;
  state.year=b.y; state.month=b.m; state.focusDay=b.d; state.selected=null;
  render();
  const c = el('calGrid').querySelector(`[data-day="${b.d}"]`);
  if (c) c.focus();
});
el('langBtn').addEventListener('click', ()=>{
  state.lang = state.lang==='ne' ? 'en' : 'ne';
  localStorage.setItem('npcal_lang', state.lang);
  render();
  populateConverterSelects();
  populatePicker();
  renderTests();
});

/* ---------- theme ---------- */
(function initTheme(){
  const saved = localStorage.getItem('npcal_theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
})();
el('themeBtn').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : (cur==='light' ? null : 'dark');
  if (next) { document.documentElement.setAttribute('data-theme', next); localStorage.setItem('npcal_theme', next); }
  else { document.documentElement.removeAttribute('data-theme'); localStorage.removeItem('npcal_theme'); }
});

/* =========================================================================
   YEAR / MONTH PICKER
   ========================================================================= */
function populatePicker(){
  const ys = el('pickerYear'); ys.innerHTML='';
  for (let y=BS_MIN_YEAR;y<=BS_MAX_YEAR;y++){
    const o = document.createElement('option');
    o.value=y; o.textContent = numeral(y, state.lang);
    if (y===state.year) o.selected = true;
    ys.appendChild(o);
  }
  const ms = el('pickerMonth'); ms.innerHTML='';
  for (let m=1;m<=12;m++){
    const o = document.createElement('option');
    o.value=m; o.textContent = monthName(m, state.lang);
    if (m===state.month) o.selected = true;
    ms.appendChild(o);
  }
}
el('monthLabelBtn').addEventListener('click', ()=>{ populatePicker(); el('pickerDialog').showModal(); });
el('pickerClose').addEventListener('click', ()=> el('pickerDialog').close());
el('pickerGo').addEventListener('click', ()=>{
  state.year = Number(el('pickerYear').value);
  state.month = Number(el('pickerMonth').value);
  state.focusDay = 1;
  el('pickerDialog').close();
  render();
});

/* =========================================================================
   CONVERTER PANEL
   ========================================================================= */
function populateConverterSelects(){
  const y1 = el('c1_y'); y1.innerHTML='';
  for (let y=BS_MIN_YEAR;y<=BS_MAX_YEAR;y++){
    const o=document.createElement('option'); o.value=y; o.textContent=numeral(y,state.lang);
    if (y===state.year) o.selected=true;
    y1.appendChild(o);
  }
  const m1 = el('c1_m'); m1.innerHTML='';
  for (let m=1;m<=12;m++){
    const o=document.createElement('option'); o.value=m; o.textContent=monthName(m,state.lang);
    m1.appendChild(o);
  }
  function fillDays1(){
    const y=Number(y1.value), m=Number(m1.value);
    const len = bsMonthLength(y,m) || 32;
    const d1 = el('c1_d'); const prev = d1.value;
    d1.innerHTML='';
    for (let d=1; d<=len; d++){
      const o=document.createElement('option'); o.value=d; o.textContent=numeral(d,state.lang);
      d1.appendChild(o);
    }
    if (prev && Number(prev)<=len) d1.value=prev;
  }
  y1.addEventListener('change', fillDays1);
  m1.addEventListener('change', fillDays1);
  fillDays1();

  // AD month select always shows Gregorian month names in English (there's
  // no separate Nepali name to toggle here, since this is the AD-side input)
  const m2 = el('c2_m'); m2.innerHTML='';
  const GREG_MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  for (let m=1;m<=12;m++){
    const o=document.createElement('option'); o.value=m; o.textContent=GREG_MONTHS_EN[m-1];
    m2.appendChild(o);
  }
  function fillDays2(){
    const y = Number(el('c2_y').value) || 2000;
    const m = Number(m2.value);
    const len = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const d2 = el('c2_d'); const prev = d2.value;
    d2.innerHTML='';
    for (let d=1; d<=len; d++){
      const o=document.createElement('option'); o.value=d; o.textContent=numeral(d,state.lang);
      d2.appendChild(o);
    }
    if (prev && Number(prev)<=len) d2.value=prev;
  }
  el('c2_y').addEventListener('input', fillDays2);
  m2.addEventListener('change', fillDays2);
  if (!el('c2_y').value){
    const n = nowInNPT(); el('c2_y').value = n.gy;
  }
  fillDays2();
}

el('c1_go').addEventListener('click', ()=>{
  const y=Number(el('c1_y').value), m=Number(el('c1_m').value), d=Number(el('c1_d').value);
  const r = bsToAD(y,m,d);
  const out = el('c1_result');
  if (r.error){ out.textContent = r.message; out.classList.add('error'); return; }
  out.classList.remove('error');
  const ne = state.lang==='ne';
  out.textContent = `${r.gy}-${String(r.gm).padStart(2,'0')}-${String(r.gd).padStart(2,'0')} (${weekdayName(r.weekday, state.lang)})`;
});
el('c2_go').addEventListener('click', ()=>{
  const y=Number(el('c2_y').value), m=Number(el('c2_m').value), d=Number(el('c2_d').value);
  const r = adToBS(y,m,d);
  const out = el('c2_result');
  if (r.error){ out.textContent = r.message; out.classList.add('error'); return; }
  out.classList.remove('error');
  out.textContent = `${monthName(r.m,state.lang)} ${numeral(r.d,state.lang)}, ${numeral(r.y,state.lang)} BS (${weekdayName(r.weekday,state.lang)})`;
});

/* =========================================================================
   SELF-TESTS
   at least 10 known BS<->AD conversions incl. month/year boundaries and an
   AD leap-year date. Cross-referenced against nepalicalendar.rat32.com.
   ========================================================================= */
function runSelfTests(){
  const results = [];
  function check(name, actual, expected){
    const pass = JSON.stringify(actual) === JSON.stringify(expected);
    results.push({ name, pass, actual, expected });
  }

  // 1) Epoch anchor
  check('BS 2000/1/1 -> AD (epoch)', bsToAD(2000,1,1), {gy:1943,gm:4,gd:14,weekday:3});
  // 2-6) Independently verified New Year anchors across the table's span
  check('BS 2050/1/1 -> AD', (({gy,gm,gd})=>({gy,gm,gd}))(bsToAD(2050,1,1)), {gy:1993,gm:4,gd:13});
  check('BS 2070/1/1 -> AD', (({gy,gm,gd})=>({gy,gm,gd}))(bsToAD(2070,1,1)), {gy:2013,gm:4,gd:14});
  check('BS 2080/1/1 -> AD', (({gy,gm,gd})=>({gy,gm,gd}))(bsToAD(2080,1,1)), {gy:2023,gm:4,gd:14});
  check('BS 2081/1/1 -> AD', (({gy,gm,gd})=>({gy,gm,gd}))(bsToAD(2081,1,1)), {gy:2024,gm:4,gd:13});
  check('BS 2082/1/1 -> AD', (({gy,gm,gd})=>({gy,gm,gd}))(bsToAD(2082,1,1)), {gy:2025,gm:4,gd:14});
  // 7) Reverse of one of the above
  check('AD 2023-04-14 -> BS', (({y,m,d})=>({y,m,d}))(adToBS(2023,4,14)), {y:2080,m:1,d:1});
  // 8) Round trip through a mid-year date
  check('round-trip BS 2083/7/15', (()=>{ const ad=bsToAD(2083,7,15); const back=adToBS(ad.gy,ad.gm,ad.gd); return {y:back.y,m:back.m,d:back.d}; })(), {y:2083,m:7,d:15});
  // 9) AD leap-year date (2024 is a Gregorian leap year)
  check('AD 2024-02-29 (leap day) round-trip', (()=>{ const bs=adToBS(2024,2,29); const back=bsToAD(bs.y,bs.m,bs.d); return {gy:back.gy,gm:back.gm,gd:back.gd}; })(), {gy:2024,gm:2,gd:29});
  // 10) BS year boundary: last day of 2081 + 1 day = first day of 2082
  check('BS 2081 year-end -> 2082/1/1', (()=>{ const lastLen=bsMonthLength(2081,12); const last=bsToAD(2081,12,lastLen); const next=new Date(Date.UTC(last.gy,last.gm-1,last.gd)+86400000); return adToBS(next.getUTCFullYear(),next.getUTCMonth()+1,next.getUTCDate()); })().y===2082 && true, true);
  // 11) Out-of-range: before epoch
  check('AD 1943-04-13 (before epoch) is out of range', adToBS(1943,4,13).error, true);
  // 12) Out-of-range: BS year beyond table
  check('BS 2091/1/1 (beyond table) is out of range', bsToAD(2091,1,1).error, true);

  return results;
}

function renderTests(){
  const results = runSelfTests();
  const passCount = results.filter(r=>r.pass).length;
  el('testSummary').textContent = `${passCount} / ${results.length} passed`;
  const list = el('testList');
  list.innerHTML = '';
  results.forEach(r=>{
    const li = document.createElement('li');
    li.className = r.pass ? 'pass' : 'fail';
    li.innerHTML = `<span class="mark">${r.pass?'✓':'✗'}</span><span>${r.name}${r.pass?'':` — expected ${JSON.stringify(r.expected)}, got ${JSON.stringify(r.actual)}`}</span>`;
    list.appendChild(li);
    console.assert(r.pass, `[Nepali Calendar self-test] ${r.name}`, {expected:r.expected, actual:r.actual});
  });
  console.log(`[Nepali Calendar self-tests] ${passCount}/${results.length} passed`);
}

/* =========================================================================
   INIT
   ========================================================================= */
populateConverterSelects();
render();
renderTests();
loadAllNotes().catch(e => console.error('Failed to load notes', e));
